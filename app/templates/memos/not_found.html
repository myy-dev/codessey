{% extends "base.html" %}

{% block title %}메모를 찾을 수 없음 | 나의 메모 앱{% endblock %}

{% block content %}
<section class="empty-state not-found">
    <p class="error-code">404</p>
    <h1>해당 메모를 찾을 수 없습니다</h1>
    <p>{{ message }}</p>
    <div class="actions centered-actions">
        <a class="button" href="{{ url_for('memo_list') }}">메모 목록으로</a>
        <a class="button button-ghost" href="{{ url_for('home') }}">홈으로</a>
    </div>
</section>
{% endblock %}
