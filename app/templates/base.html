<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FastAPI와 SQLAlchemy로 만든 메모 관리 애플리케이션">
    <title>{% block title %}나의 메모 앱{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v={{ styles_version() }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
        <nav class="nav container" aria-label="주요 메뉴">
            <a class="brand" href="{{ url_for('home') }}">나의 메모 앱</a>
        </nav>
    </header>

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">나의 메모 앱 · 생각을 기록하는 공간</div>
    </footer>
</body>
</html>
