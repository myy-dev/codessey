<form action="{{ form_action }}" method="post" novalidate>
    <div class="memo-form">
        <header class="detail-header">
            <div>
                <p class="eyebrow">{{ form_eyebrow }}</p>
                <h1>{{ form_heading }}</h1>
            </div>
        </header>

        {% if errors %}
        <div class="alert" role="alert">입력값을 확인해 주세요.</div>
        {% endif %}

        <div class="form-field">
            <label for="title">제목 <span aria-hidden="true">*</span></label>
            <input
                id="title"
                name="title"
                type="text"
                value="{{ form.title }}"
                maxlength="120"
                required
                aria-describedby="{% if errors.title %}title-error{% else %}title-help{% endif %}"
            >
            {% if errors.title %}
            <p class="field-error" id="title-error">{{ errors.title }}</p>
            {% else %}
            <p class="field-help" id="title-help">120자 이하로 입력해 주세요.</p>
            {% endif %}
        </div>

        <div class="form-field">
            <label for="content">내용 <span aria-hidden="true">*</span></label>
            <textarea
                id="content"
                name="content"
                rows="12"
                maxlength="1000"
                required
                aria-describedby="{% if errors.content %}content-error{% else %}content-help{% endif %}"
            >{{ form.content }}</textarea>
            {% if errors.content %}
            <p class="field-error" id="content-error">{{ errors.content }}</p>
            {% else %}
            <p class="field-help" id="content-help">1,000자 이하로 입력해 주세요.</p>
            {% endif %}
        </div>

    </div>

    <div class="bottom-link list-actions">
        <a class="button button-ghost" href="{{ url_for('memo_list') }}">목록</a>
        <button class="button" type="submit">저장</button>
    </div>
</form>
