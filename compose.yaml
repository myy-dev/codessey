services:
  agent-lab:
    build: .
    platform: linux/arm64
    init: true
    network_mode: none
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    environment:
      MEMORY_LIMIT: ${MEMORY_LIMIT:-50}
      CPU_MAX_OCCUPY: ${CPU_MAX_OCCUPY:-20}
      MULTI_THREAD_ENABLE: ${MULTI_THREAD_ENABLE:-true}
